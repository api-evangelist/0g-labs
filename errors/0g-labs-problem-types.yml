note: >-
  0G does NOT use RFC 9457 application/problem+json. Errors follow the OpenAI-compatible
  envelope, which is the right call for a gateway whose whole value proposition is that an
  OpenAI client works unchanged. error.type buckets the failure; error.code identifies the
  specific cause; request_id appears at the top level when available.
