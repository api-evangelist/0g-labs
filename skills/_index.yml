gaps:
- id: skills-pin-superseded-sdk
  detail: >-
    Every skill pins @0glabs/0g-ts-sdk ^0.3.3 and @0glabs/0g-serving-broker ^0.6.5, while the
    current docs install @0gfoundation/0g-storage-ts-sdk (1.2.10) and
    @0gfoundation/0g-compute-ts-sdk (0.9.0). Both @0glabs packages still resolve on npm (200 on
    2026-08-05), so the skills work — but an agent following them verbatim installs the
    superseded @0glabs scope rather than what the docs now tell a human to install.
- id: no-router-skill
  detail: >-
    None of the 14 skills covers the Router — the surface 0G's own docs call "recommended for
    most applications". The skills all target the Direct wallet-signed path.
