observations:
- id: undocumented-admin-surface
  detail: >-
    126 component schemas back only 23 published paths. Admin, partner, project-grant, Stripe
    checkout, Privy sign-in and settlement-mode schemas (AdminRoleView, CreatePartnerRequest,
    stripeCheckoutRequest, PrivySigninRequest, setSettlementModeRequest, …) are defined in the
    public spec but have no corresponding public operation — an internal console surface leaking
    into the published contract rather than a callable API.
- id: no-operation-ids
  detail: >-
    Not one of the 23 operations declares an operationId. Every operation does carry a summary,
    a description and a tag, so the spec is otherwise well-formed; the missing operationIds are
    what stop tooling (and this pipeline's Arazzo/skill grounding) from naming operations
    stably. Recorded in overlays/0g-labs-router-overlay.yaml as our proposed ids.
