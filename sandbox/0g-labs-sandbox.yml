generated: '2026-08-05'
method: searched
source: https://docs.0g.ai/developer-hub/testnet/testnet-overview
summary: >-
  0G's sandbox is a full public testnet, not a mocked test mode. "Galileo" is a separate chain
  (ID 16602) with its own RPC, its own storage indexer, its own explorer, its own Router
  deployment and a faucet that dispenses real testnet 0G. Test and live are separated by
  NETWORK, not by a key prefix — there is no sk_test_/sk_live_ style distinction on the Router,
  so an account and its API keys belong to whichever deployment issued them.
separation_model:
  kind: separate-network
  key_prefix_separation: false
  detail: >-
    Router key prefixes (sk-, mk-) encode PURPOSE, not environment. Environment is chosen by
    base_url and by which console you signed into.
environments:
- name: Mainnet (Aristotle)
  chain_id: 16661
  token_symbol: 0G
  rpc: https://evmrpc.0g.ai
  router_console: https://pc.0g.ai
  router_api: https://router-api.0g.ai/v1
  storage_indexer: https://indexer-storage-turbo.0g.ai
  block_explorer: https://chainscan.0g.ai
  storage_explorer: https://storagescan.0g.ai
  ecosystem_explorer: https://explorer.0g.ai/mainnet/home
  storage_start_block: 2387557
  funds: real
