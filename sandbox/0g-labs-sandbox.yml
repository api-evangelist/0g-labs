anonymous_exploration:
  note: >-
    Three Router endpoints answer with no credential at all, so the model catalog, live pricing,
    provider health and service types can be explored before signing up or depositing anything.
    Verified 200 on 2026-08-05.
  endpoints:
  - url: https://router-api.0g.ai/v1/models
    status: 200
  - url: https://router-api.0g.ai/v1/providers
    status: 200
  - url: https://router-api.0g.ai/v1/service-types
    status: 200
dry_run_tooling:
- name: routing preview
  endpoint: POST /v1/routing/preview
  detail: >-
    Resolve which provider a given request and set of X-0G-Provider-* headers would select,
    without running (and paying for) the inference.
- name: verify_tee
  detail: >-
    Opt-in synchronous TEE signature verification, reported as tee_verified in x_0g_trace — the
    way to assert in a test that the model you asked for is the model that ran.
- name: 0g-storage-client gen
  detail: CLI subcommand that generates test files for storage upload/download exercises.
- name: storage web tool
  url: https://storagescan-galileo.0g.ai/tool
  detail: Browser upload/download against testnet storage for one-off checks.
test_clocks: false
test_values_note: >-
  0G publishes no magic test identifiers (no test card numbers, no reserved phone numbers, no
  hosted test tokens). The equivalent affordance is the faucet plus a separate chain, so test
  runs use real-shaped values on a throwaway network.
credentials_note: >-
  Every value above is a public network parameter or a published testnet contract address. No
  key, secret, or private key is recorded here; the CLI --key flag takes the operator's own.
