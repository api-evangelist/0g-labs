skill_only:
- capability: 0G Storage upload / download / merkle verification
  reason: >-
    Storage is not on the Router REST surface at all. It is reached through the Go/TS SDKs, the
    0g-storage-client CLI, or a self-run gateway — so the three storage skills bind to SDK calls,
    not to any operation in this spec.
  skills: [storage-upload-file, storage-download-file, storage-merkle-verification]
- capability: Direct (wallet-signed) inference and per-provider sub-accounts
  reason: >-
    The Direct path deliberately has no API key and no gateway endpoint; the caller's wallet
    signs each request against a provider sub-account. No REST operation exists to bind to.
  skills: [compute-account-management, compute-streaming-chat, compute-provider-discovery]
- capability: Fine-tuning
  reason: >-
    Run through the compute broker CLI against the Direct path. The Router spec has no
    fine-tuning operation.
  skills: [compute-fine-tuning]
- capability: Contract scaffold / deploy / interact on 0G Chain
  reason: EVM JSON-RPC and Solidity tooling, not a Router operation.
  skills: [chain-scaffold-project, chain-deploy-contract, chain-interact-contract]
- capability: Cross-layer composition (storage+chain, compute+storage)
  reason: Compose two SDK surfaces; no single REST operation backs them.
  skills: [cross-layer-storage-plus-chain, cross-layer-compute-plus-storage]
