          example: "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
    github_com_0glabs_0g-router_pkg_response.AdminUsageDailyResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.AdminUsage\
              DailyEntry"
        object:
          type: string
