        id:
          type: string
          example: foopartner
        link:
          type: string
          example: https://foopartner.com
        logo_url:
          type: string
          example: https://cdn.example/logo.png
        name:
          type: string
          example: FooPartner
    internal_handler.RoutePreviewCandidate:
      type: object
      properties:
        address:
          type: string
        canonical_id:
          type: string
        endpoint:
          type: string
        model_id:
          type: string
    internal_handler.RoutePreviewRequest:
      type: object
      properties:
        model:
          description: "OPTIONAL: canonical id (or alias / on-chain id); empty = any
            provider of this service type"
