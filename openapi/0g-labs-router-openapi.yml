                  nse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: Model not found (unknown model id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "423":
          description: Refund pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "429":
          description: Rate limit exceeded
          content:
