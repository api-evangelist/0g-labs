  /models:
    get:
      description: >-
        Get all available AI models. By default the response is the **canonical
        view**: one row per `canonical_id`, with curated registry metadata and
        endpoints aggregated (max context, union of params/formats, cheapest
        pricing); `id` is the canonical model id. A model stays listed even when
        all its endpoints are temporarily unhealthy (health is not a visibility
        filter; routing falls back to unhealthy endpoints so a listed model is
        always routable). To enumerate the endpoints behind a canonical id, call
        `GET /v1/providers?canonical_id=<id>`. provider_address uses OR (match
        any), input_modality and supported_parameter use AND (must match all).

        `?legacy=true` returns the historical view keyed by the raw provider `model_id` (one row per on-chain model id, including ids not mapped to a registered canonical), for clients that have not migrated to canonical ids. This is a **listing-only** compatibility surface — routing remains canonical-only, so a raw id absent from the model registry is still `404 model_not_found` on the inference path. **[beta]**
      tags:
        - Models
      summary: Get model list
      parameters:
        - description: "[beta] true: historical raw-model_id-keyed view (listing-only; an
            unregistered id it lists is still 404 on the inference path).
            Default false: canonical view (id = canonical_id)."
          name: legacy
          in: query
          schema:
            type: boolean
        - description: "[beta] 'usd': emit the OpenRouter-standard shape with per-token
            USD decimal strings under the top-level `pricing` field (for
            external pricing aggregators, e.g. TKX); models without a USD price
            are omitted. Default: native prices under `pricing`, USD under
            `pricing_usd`."
          name: pricing
          in: query
          schema:
            type: string
            enum:
              - usd
        - description: "Filter by provider address (OR: match any)"
          name: provider_address
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: "Filter by input modality, e.g. text, image (AND: must support all)"
          name: input_modality
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: "Filter by supported parameter, e.g. temperature (AND: must support
            all)"
          name: supported_parameter
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ModelListR\
                  esponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /providers:
    get:
      description: 'Get all TEE-acknowledged providers, optionally narrowed by service
        type, on-chain model id, and/or canonical id. `model` and `canonical_id`
        are independent filters and compose (ANDed): `canonical_id` alone lists
        every endpoint of a canonical, while `model` + `canonical_id` narrows to
        a specific endpoint within it. An empty value means "not filtered on"
        (so no filters = list all). Includes providers with unknown health
        status (is_healthy=null).'
      tags:
        - Provider
      summary: Get provider list
      parameters:
        - description: Filter by service type (chatbot, text-to-image, speech-to-text)
          name: service_type
          in: query
          schema:
            type: string
        - description: Filter by on-chain model ID (e.g. zai-org/GLM-5.1-FP8); exact
            model_id match. Empty = not filtered.
          name: model
          in: query
          schema:
            type: string
        - description: "[beta] Filter by canonical model ID (e.g. glm-5.1); lists every
            endpoint serving that canonical. Composes (AND) with model. Empty =
            not filtered."
          name: canonical_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ProviderLi\
                  stResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /routing/preview:
    post:
      security:
        - ApiKeyAuth: []
      description: >-
        Return, in fallback order, the provider(s) the router WOULD select for a
        request — WITHOUT executing, billing, or mutating routing state. Built
        for end-to-end-encrypted (sealed) requests: a sealed request must be
        encrypted to a specific provider enclave before it can be sent, so a
        gateway calls this first (with the sensitive `messages` / prompt
        stripped out), seals to the head candidate, and pins the real request to
        it via `X-0G-Provider-Address` — falling back to the next candidate
        (re-sealing) on failure.


        The body is the stripped inference request plus the control field `service_type` — the internal service type being previewed (`chatbot` | `text-to-image` | `image-editing` | `speech-to-text`). This is the SAME vocabulary returned by `GET /v1/service-types` (`.type`) and accepted by `GET /v1/providers` (`?service_type=`), so a caller discovering providers via the catalog feeds the same string straight in (it is NOT the model-modality `type` on `/v1/models`). Anthropic (`/v1/messages`) sealed requests are not supported yet, so `anthropic-chat` is not an accepted value. `model` is OPTIONAL: given, candidates are that model's providers; omitted, candidates are ANY provider of the service type (a heterogeneous list — each candidate carries its own `canonical_id` / `model_id`). Routing preferences (`provider` / `X-0G-Provider-*`) and capability signals (`tools`, `response_format`, `max_tokens`, `reasoning_effort`) are read from the body/headers exactly as on the inference endpoints, so the previewed order matches what the request would select. The number of candidates is fixed at the router's provider-retry budget (the length of the fallback chain the router itself would try); a smaller healthy pool returns fewer. Each candidate returns the provider `address` (to pin), its broker `endpoint` (to fetch the enclave key from), and the model it serves (`canonical_id` to put in the sealed request, `model_id` informational). A pinned `provider.address` returns just that provider. For the multipart inference endpoints (`image-editing`, `speech-to-text`) there is no JSON body to strip: synthesize this JSON body carrying `service_type` + `model` and forward routing prefs via `X-0G-Provider-*` headers — the uploaded blob (`file` / `mask`) and `prompt` need not (and should not) be included, as they are both sensitive and irrelevant to provider selection. This endpoint is in limited availability and may be unavailable (`404`) in some environments. [beta]
      tags:
        - Inference
      summary: Preview provider selection (E2EE)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_handler.RoutePreviewRequest"
        description: Preview request (stripped inference body + service_type/model)
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.RoutePreviewResponse"
        "400":
          description: Request error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "503":
          description: No available provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /service-types:
    get:
      description: Get service types that have at least one TEE-acknowledged provider
        (health is not a filter — a service type stays listed even when its
        providers are temporarily unhealthy)
      tags:
        - Service Types
      summary: Get available service types
      responses:
        "200":
          description: Service type list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ServiceTyp\
                  eListResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /videos:
    post:
      security:
        - ApiKeyAuth: []
      description: >-
        Submit a video generation job (OpenAI Video API shape). The response
        includes `id` and `provider_address` — clients poll `GET
        /videos/{id}?provider_address=...` and download the result from `GET
        /videos/{id}/content?provider_address=...`.

        Accepts `application/json` OR `multipart/form-data`. Use multipart to drive image-to-video: send the same fields as form values plus the reference image as a file part.

        Supports provider routing preferences via `X-0G-Provider-*` request headers (`Address`, `Sort`, `Trust-Mode`, `Allow-Fallbacks`), identical to the other inference endpoints.

        The request shape is the OpenAI Video API's, but the models behind it are not OpenAI's, and where a model's own limits differ from OpenAI's they win. Those limits are per-model — read them from the model's `description` and `pricing.variants` on `GET /v1/models` rather than assuming the OpenAI defaults — and a request that violates one is rejected by the model provider, so the error text and any numeric code in it are theirs, not ours. The two that differ most often are `size` and `seconds`.

        `size` names a resolution TIER, not output dimensions, because a video model advertises the tiers it is PRICED at rather than arbitrary sizes. Two spellings are accepted and they are not equivalent. **Pixel dimensions** (`1280x720`, OpenAI's spelling and what an SDK sends) select the ASPECT RATIO only, and only for text-to-video — the clip renders at whatever tier the model serves, so on a 2K-only model `1280x720` returns a 2560x1440 clip billed at the 2K rate, not a 720p one. For **image-to-video** the aspect ratio follows your reference image, so pixel dimensions have no effect there — a tier name still selects the tier. **A tier name** (`2K`) addresses the tier directly. Send only names that appear in that list — it is the set this endpoint can price, and it grows as a model adds tiers, so read it rather than hard-coding what a model serves today. Read the tiers from `pricing.variants[].dimensions.resolution`. Omitting `size` is the recommended default — the model's own default tier and aspect ratio apply.

        `seconds` is clamped to the model's supported range rather than rejected, in BOTH directions and without an error: ask for less than the minimum and you get (and pay for) the minimum; ask for more than the maximum and you get the maximum. The clip you are billed for is the one actually produced, so a request outside the range costs something other than what you asked for. The range is per-model and stated in the model's description.

        For both fields the submit response echoes what you SENT, while the poll response reports what was actually rendered. Reconcile against the poll.
      tags:
        - Inference
      summary: Submit async video generation job
      parameters:
        - description: "Routing: pin to a specific provider by on-chain address
            (0x-prefixed)."
          name: X-0G-Provider-Address
          in: header
          schema:
            type: string
        - description: "Routing: provider sort strategy. `latency` | `price`."
          name: X-0G-Provider-Sort
          in: header
          schema:
            type: string
        - description: "Routing: trust tier filter (`verified` | `private`). `verified` is
            a floor — `private` providers also satisfy it."
          name: X-0G-Provider-Trust-Mode
          in: header
          schema:
            type: string
        - description: "Routing: whether to retry on other providers after a failure.
            `true` | `false`. Defaults to false when an address is pinned, true
            otherwise."
          name: X-0G-Provider-Allow-Fallbacks
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: Video generation request. `model`, `prompt` and `seconds` are
          REQUIRED (`seconds` is optional in the upstream OpenAI Video API but
          mandatory here — see the changelog); `size` is optional.
        required: true
      responses:
        "200":
          description: Job submitted; response carries id, status, provider_address
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Request error — includes `seconds is required` and a `seconds`
            value the model has no price for (the available durations are
            listed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: model_not_found — no provider on the network serves this model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "423":
          description: refund_pending — a refund is in progress for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "429":
          description: video_jobs_in_flight_limit — too many unfinished video jobs for
            this account; poll or wait for the earlier ones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "501":
          description: Not available in USD mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "503":
          description: no_available_provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  "/videos/{id}":
    get:
      security:
        - ApiKeyAuth: []
      description: Return a video job's current status. When the job has completed
        this is also what settles the charge. `provider_address` is optional —
        it is resolved from the job id when omitted, so an OpenAI-native client
        can call `GET /videos/{id}` with no query parameters.
      tags:
        - Inference
      summary: Poll async video generation job
      parameters:
        - description: Video job id returned by POST /videos
          name: id
          in: path
          required: true
          schema:
            type: string
        - description: Pin the provider that owns this job; resolved from the job id when
            omitted
          name: provider_address
          in: query
          schema:
            type: string
        - description: Verify the provider's TEE signature and include the trace
          name: verify_tee
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Job status; on completion the result payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Request error — includes a job id tracked against more than one
            provider, where `provider_address` must be supplied to disambiguate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Caller is not the submitter of this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: async_job_not_found — this router has no such job id (it never
            existed, or it belongs to a different provider than the one pinned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "502":
          description: Upstream provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  "/videos/{id}/content":
    get:
      security:
        - ApiKeyAuth: []
      description: Stream the finished video file. If the job has not been charged yet
        (the client never polled `GET /videos/{id}`) it is charged before any
        bytes are sent. A job that is still running returns 409; a job that
        failed at the provider returns 424. `provider_address` is optional — it
        is resolved from the job id when omitted.
      tags:
        - Inference
      summary: Download a completed video
      parameters:
        - description: Video job id returned by POST /videos
          name: id
          in: path
          required: true
          schema:
            type: string
        - description: Pin the provider that owns this job; resolved from the job id when
            omitted
          name: provider_address
          in: query
          schema:
            type: string
        - description: Verify the provider's TEE signature before billing
          name: verify_tee
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The video file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Request error — includes a job id tracked against more than one
            provider, where `provider_address` must be supplied to disambiguate
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Caller is not the submitter of this job
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: async_job_not_found — this router has no such job id (it never
            existed, or it belongs to a different provider than the one pinned)
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "409":
          description: Video not ready yet; keep polling GET /videos/{id}
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "424":
          description: The video job failed at the provider and has no output
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "429":
          description: Too many concurrent downloads for this account
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "502":
          description: Upstream provider error
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
tags: []
servers:
  - url: /v1
components:
  requestBodies:
    github_com_0glabs_0g-router_pkg_inference.ImageGenerationRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ImageGene\
              rationRequest"
      description: Image generation request
      required: true
  securitySchemes:
    ApiKeyAuth:
      description: 'API key for inference, file upload, and async image endpoints.
        Format: "Bearer sk-..."'
      type: apiKey
      name: Authorization
      in: header
    ManagementKeyAuth:
      description: 'Management key for account read and API key management.
        Capabilities are scope-limited per key (account:read, keys:read,
        keys:create, keys:manage). Format: "Bearer mk-..."'
      type: apiKey
      name: Authorization
      in: header
  schemas:
    github_com_0glabs_0g-router_internal_service.AdminRoleView:
      type: object
      properties:
        created_at:
          type: string
        granted_by:
          type: string
        scopes:
          type: array
          items:
            type: string
        updated_at:
          type: string
        wallet_address:
          type: string
    github_com_0glabs_0g-router_internal_service.CreateProjectGrantRequest:
      type: object
      required:
        - owner_address
        - total_quota
      properties:
        currency:
          description: >-
            Currency selects the grant's unit and target ledger: "0g" (the
            default when

            omitted) or "usd". A "usd" grant requires features.usd_billing.
          type: string
        expires_at:
          description: RFC3339, "" = never
          type: string
