            success path always sets it, so the normal wire shape is unchanged.
          allOf:
            - $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_inference.BillingIn\
                fo"
        provider:
          description: Provider address
          type: string
          example: 0x1234...
