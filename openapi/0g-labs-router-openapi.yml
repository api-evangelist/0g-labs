    github_com_0glabs_0g-router_pkg_response.AdminUsageLogEntry:
      type: object
      properties:
        api_key_id:
          type: string
          example: abc12345
        cache_write_1h_tokens:
          description: 1-hour-TTL portion of cache_write_tokens (disjoint); only the
            Anthropic path reports a TTL breakdown, else 0
          type: integer
          example: 0
        cache_write_tokens:
          description: cache-WRITE (creation) subset of input_tokens; reflects volume, not
            a premium (disjoint from cached_tokens; input_tokens includes both)
          type: integer
          example: 0
        cached_tokens:
          description: cache-READ subset of input_tokens
          type: integer
          example: 40
        canonical_id:
          description: registry-resolved canonical id ('' if unmapped); mirrors
            /v1/source/usage/history
          type: string
          example: glm-5
        cost:
          description: neuron (1 0G = 10^18)
          type: string
          example: "150000000000000"
