    internal_handler.UpdatePartnerRequest:
      type: object
      properties:
        contact_email:
          type: string
        link:
          type: string
        logo_url:
          type: string
        name:
          type: string
          example: FooPartner (renamed)
        status:
          type: string
          example: active
    internal_handler.UploadFileResponse:
      type: object
      properties:
        expires_at:
          type: string
          example: 2026-03-01T14:00:00Z
        filename:
          type: string
          example: document.pdf
        id:
          type: string
          example: file-abc123
        mime_type:
          type: string
          example: application/pdf
        size:
          type: integer
          example: 1024
    internal_handler.batchGrantRequest:
      type: object
      required:
        - grants
      properties:
        grants:
          type: array
          maxItems: 100
          minItems: 1
          items:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_internal_service.GrantC\
              reditRequest"
    internal_handler.createAdminScopedKeyRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        expiration:
          description: |-
            Expiration is optional: RFC3339 (e.g. 2026-12-31T23:59:59+08:00) or
            "no_expiration"/empty for a non-expiring key. Same grammar as
            ParseExpiration elsewhere.
          type: string
        name:
          type: string
        scopes:
          description: admin-only scopes, e.g. ["usage:read"]
          type: array
          minItems: 1
          items:
            type: string
    internal_handler.putAdminRoleRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
    internal_handler.setSettlementModeRequest:
      type: object
      properties:
        mode:
          description: '"0g" or "usd"'
          type: string
          example: usd
    internal_handler.stripeCheckoutRequest:
      type: object
      required:
        - amount_micro
        - success_url
      properties:
        amount_micro:
          type: string
        cancel_url:
          type: string
        email:
          description: >-
            Email (optional) → Stripe customer_email: prefills the email field +
            gets

            the receipt. Not persisted server-side.
          type: string
        success_url:
          description: >-
            SuccessURL (required) / CancelURL (optional) → the browser return
            targets.

            The frontend owns the path (e.g. its locale prefix); the backend validates

            only the origin against auth.allowed_origins. There is no server-side

            default — success_url must be supplied on every request.
          type: string
    internal_handler.updateProjectGrantRequest:
      type: object
      required:
        - status
      properties:
        status:
          description: '"active" | "paused"'
          type: string
