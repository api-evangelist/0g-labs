  /routing/preview:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Return, in fallback order, the provider(s) the router WOULD select for a request — WITHOUT executing, billing, or mutating routing state. Built for end-to-end-encrypted (sealed) requests: a sealed request must be encrypted to a specific provider enclave before it can be sent, so a gateway calls this first (with the sensitive `messages` / prompt stripped out), seals to the head candidate, and pins the real request to it via `X-0G-Provider-Address` — falling back to the next candidate (re-sealing) on failure.


        The body is the stripped inference request plus the control field `service_type` — the internal service type being previewed (`chatbot` | `text-to-image` | `image-editing` | `speech-to-text`). This is the SAME vocabulary returned by `GET /v1/service-types` (`.type`) and accepted by `GET /v1/providers` (`?service_type=`), so a caller discovering providers via the catalog feeds the same string straight in (it is NOT the model-modality `type` on `/v1/models`). Anthropic (`/v1/messages`) sealed requests are not supported yet, so `anthropic-chat` is not an accepted value. `model` is OPTIONAL: given, candidates are that model''s providers; omitted, candidates are ANY provider of the service type (a heterogeneous list — each candidate carries its own `canonical_id` / `model_id`). Routing preferences (`provider` / `X-0G-Provider-*`) and capability signals (`tools`, `response_format`, `max_tokens`, `reasoning_effort`) are read from the body/headers exactly as on the inference endpoints, so the previewed order matches what the request would select. The number of candidates is fixed at the router''s provider-retry budget (the length of the fallback chain the router itself would try); a smaller healthy pool returns fewer. Each candidate returns the provider `address` (to pin), its broker `endpoint` (to fetch the enclave key from), and the model it serves (`canonical_id` to put in the sealed request, `model_id` informational). A pinned `provider.address` returns just that provider. For the multipart inference endpoints (`image-editing`, `speech-to-text`) there is no JSON body to strip: synthesize this JSON body carrying `service_type` + `model` and forward routing prefs via `X-0G-Provider-*` headers — the uploaded blob (`file` / `mask`) and `prompt` need not (and should not) be included, as they are both sensitive and irrelevant to provider selection. This endpoint is in limited availability and may be unavailable (`404`) in some environments. [beta]'
      tags:
      - Inference
      summary: Preview provider selection (E2EE)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handler.RoutePreviewRequest'
        description: Preview request (stripped inference body + service_type/model)
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_handler.RoutePreviewResponse'
        '400':
          description: Request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '503':
          description: No available provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
  /videos:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Submit a video generation job (OpenAI Video API shape). The response includes `id` and `provider_address` — clients poll `GET /videos/{id}?provider_address=...` and download the result from `GET /videos/{id}/content?provider_address=...`.

        Accepts `application/json` OR `multipart/form-data`. Use multipart to drive image-to-video: send the same fields as form values plus the reference image as a file part.

        Supports provider routing preferences via `X-0G-Provider-*` request headers (`Address`, `Sort`, `Trust-Mode`, `Allow-Fallbacks`), identical to the other inference endpoints.

        The request shape is the OpenAI Video API''s, but the models behind it are not OpenAI''s, and where a model''s own limits differ from OpenAI''s they win. Those limits are per-model — read them from the model''s `description` and `pricing.variants` on `GET /v1/models` rather than assuming the OpenAI defaults — and a request that violates one is rejected by the model provider, so the error text and any numeric code in it are theirs, not ours. The two that differ most often are `size` and `seconds`.

        `size` names a resolution TIER, not output dimensions, because a video model advertises the tiers it is PRICED at rather than arbitrary sizes. Two spellings are accepted and they are not equivalent. **Pixel dimensions** (`1280x720`, OpenAI''s spelling and what an SDK sends) select the ASPECT RATIO only, and only for text-to-video — the clip renders at whatever tier the model serves, so on a 2K-only model `1280x720` returns a 2560x1440 clip billed at the 2K rate, not a 720p one. For **image-to-video** the aspect ratio follows your reference image, so pixel dimensions have no effect there — a tier name still selects the tier. **A tier name** (`2K`) addresses the tier directly. Send only names that appear in that list — it is the set this endpoint can price, and it grows as a model adds tiers, so read it rather than hard-coding what a model serves today. Read the tiers from `pricing.variants[].dimensions.resolution`. Omitting `size` is the recommended default — the model''s own default tier and aspect ratio apply.

        `seconds` is clamped to the model''s supported range rather than rejected, in BOTH directions and without an error: ask for less than the minimum and you get (and pay for) the minimum; ask for more than the maximum and you get the maximum. The clip you are billed for is the one actually produced, so a request outside the range costs something other than what you asked for. The range is per-model and stated in the model''s description.

        For both fields the submit response echoes what you SENT, while the poll response reports what was actually rendered. Reconcile against the poll.'
      tags:
      - Inference
      summary: Submit async video generation job
      parameters:
      - description: 'Routing: pin to a specific provider by on-chain address (0x-prefixed).'
        name: X-0G-Provider-Address
        in: header
        schema:
          type: string
      - description: 'Routing: provider sort strategy. `latency` | `price`.'
        name: X-0G-Provider-Sort
        in: header
        schema:
          type: string
      - description: 'Routing: trust tier filter (`verified` | `private`). `verified` is a floor — `private` providers also satisfy it.'
        name: X-0G-Provider-Trust-Mode
        in: header
        schema:
          type: string
      - description: 'Routing: whether to retry on other providers after a failure. `true` | `false`. Defaults to false when an address is pinned, true otherwise.'
        name: X-0G-Provider-Allow-Fallbacks
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: Video generation request. `model`, `prompt` and `seconds` are REQUIRED (`seconds` is optional in the upstream OpenAI Video API but mandatory here — see the changelog); `size` is optional.
        required: true
      responses:
        '200':
          description: Job submitted; response carries id, status, provider_address
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Request error — includes `seconds is required` and a `seconds` value the model has no price for (the available durations are listed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: model_not_found — no provider on the network serves this model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '423':
          description: refund_pending — a refund is in progress for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '429':
          description: video_jobs_in_flight_limit — too many unfinished video jobs for this account; poll or wait for the earlier ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '501':
          description: Not available in USD mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '503':
          description: no_available_provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
  /videos/{id}:
    get:
      security:
      - ApiKeyAuth: []
      description: Return a video job's current status. When the job has completed this is also what settles the charge. `provider_address` is optional — it is resolved from the job id when omitted, so an OpenAI-native client can call `GET /videos/{id}` with no query parameters.
      tags:
      - Inference
      summary: Poll async video generation job
      parameters:
      - description: Video job id returned by POST /videos
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Pin the provider that owns this job; resolved from the job id when omitted
        name: provider_address
        in: query
        schema:
          type: string
      - description: Verify the provider's TEE signature and include the trace
        name: verify_tee
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Job status; on completion the result payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Request error — includes a job id tracked against more than one provider, where `provider_address` must be supplied to disambiguate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '403':
          description: Caller is not the submitter of this job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: async_job_not_found — this router has no such job id (it never existed, or it belongs to a different provider than the one pinned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '502':
          description: Upstream provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
  /videos/{id}/content:
    get:
      security:
      - ApiKeyAuth: []
      description: Stream the finished video file. If the job has not been charged yet (the client never polled `GET /videos/{id}`) it is charged before any bytes are sent. A job that is still running returns 409; a job that failed at the provider returns 424. `provider_address` is optional — it is resolved from the job id when omitted.
      tags:
      - Inference
      summary: Download a completed video
      parameters:
      - description: Video job id returned by POST /videos
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Pin the provider that owns this job; resolved from the job id when omitted
        name: provider_address
        in: query
        schema:
          type: string
      - description: Verify the provider's TEE signature before billing
        name: verify_tee
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: The video file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Request error — includes a job id tracked against more than one provider, where `provider_address` must be supplied to disambiguate
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '403':
          description: Caller is not the submitter of this job
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: async_job_not_found — this router has no such job id (it never existed, or it belongs to a different provider than the one pinned)
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '409':
          description: Video not ready yet; keep polling GET /videos/{id}
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '424':
          description: The video job failed at the provider and has no output
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '429':
          description: Too many concurrent downloads for this account
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '502':
          description: Upstream provider error
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
components:
  schemas:
    github_com_0glabs_0g-router_pkg_inference.ResponseFormat:
      type: object
      properties:
        json_schema:
          description: 'Required when type is "json_schema": {name, schema, strict?}'
        type:
          description: '"text", "json_object", or "json_schema"'
          type: string
          example: json_schema
    github_com_0glabs_0g-router_pkg_inference.ChatCompletionRequest:
      type: object
      properties:
        attachments:
          description: File attachments (uploaded via /v1/files)
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.Attachment'
        max_tokens:
          description: Maximum output tokens
          type: integer
          example: 1024
        messages:
          description: Message list (content may be string or multimodal array)
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.RequestMessage'
        model:
          description: Model ID
          type: string
          example: qwen/qwen-2.5-7b-instruct
        plugins:
          description: Plugins to enable (e.g. [{"id":"web"}] for web search)
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.Plugin'
        provider:
          description: Routing preferences (0G Router extension)
          allOf:
          - $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ProviderPreferences'
        response_format:
          description: 'Output format: json_object or json_schema for structured output'
          allOf:
          - $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ResponseFormat'
        stream:
          description: Whether to stream output
          type: boolean
          example: false
        temperature:
          description: Temperature parameter (0-2)
          type: number
          example: 0.7
        tool_choice:
          description: 'Which tool to use: "none", "auto", "required", or {"type":"function","function":{"name":"..."}}'
        tools:
          description: Tools (functions) the model may call
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.Tool'
        top_p:
          description: Top-p sampling parameter
          type: number
          example: 0.9
    github_com_0glabs_0g-router_pkg_inference.AnthropicContentBlock:
      type: object
      properties:
        id:
          description: tool_use fields
          type: string
        input: {}
        name:
          type: string
        text:
          type: string
        type:
          description: '"text", "tool_use", etc.'
          type: string
    github_com_0glabs_0g-router_pkg_inference.AudioTranscriptionResponse:
      type: object
      properties:
        duration:
          description: Audio duration (seconds)
          type: number
          example: 5.5
        language:
          description: Detected language
          type: string
          example: en
        text:
          description: Transcribed text
          type: string
          example: Hello, world!
    github_com_0glabs_0g-router_pkg_inference.AudioTranscriptionRequest:
      type: object
      properties:
        file_base64:
          description: Base64 encoded audio file
          type: string
          example: SGVsbG8gd29ybGQ=
        filename:
          description: Filename
          type: string
          example: audio.mp3
        language:
          description: Audio language
          type: string
          example: en
        model:
          description: Model ID
          type: string
          example: whisper-1
        response_format:
          description: Response format
          type: string
          example: json
    github_com_0glabs_0g-router_pkg_response.ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorDetail'
        request_id:
          type: string
    github_com_0glabs_0g-router_pkg_inference.BillingInfo:
      type: object
      properties:
        currency:
          description: 'Currency is the unit of the cost fields: "0g" (wei) or "usd" (micro-USD),

            matching the account''s settlement mode. Omitted on the wire for 0G traces

            (empty → the historical wei default), so the field is additive.'
          type: string
          example: usd
        input_cost:
          description: Input cost
          type: string
          example: '0.00001'
        output_cost:
          description: Output cost
          type: string
          example: '0.00002'
        total_cost:
          description: Total cost
          type: string
          example: '0.00003'
    github_com_0glabs_0g-router_pkg_inference.PromptTokensDetails:
      type: object
      properties:
        cache_write_1h_tokens:
          description: 1-hour-TTL portion of the cache-write tokens
          type: integer
        cache_write_tokens:
          description: Default/5-minute subset of PromptTokens written to prompt cache (creation)
          type: integer
        cached_tokens:
          description: Subset of PromptTokens served from prompt cache (read)
          type: integer
    github_com_0glabs_0g-router_pkg_response.ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: bad_request
        message:
          type: string
          example: Invalid request
        type:
          type: string
          example: invalid_request
    github_com_0glabs_0g-router_pkg_inference.Plugin:
      type: object
      properties:
        id:
          description: Plugin ID ("web" for web search)
          type: string
          example: web
    github_com_0glabs_0g-router_pkg_inference.Tool:
      type: object
      properties:
        function:
          description: Function definition
          allOf:
          - $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ToolFunction'
        type:
          description: Tool type (currently only "function")
          type: string
          example: function
    github_com_0glabs_0g-router_pkg_inference.RequestMessage:
      type: object
      properties:
        content:
          type: string
          example: Hello!
        role:
          type: string
          example: user
    github_com_0glabs_0g-router_pkg_inference.AnthropicUsage:
      type: object
      properties:
        cache_creation:
          $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.AnthropicCacheCreation'
        cache_creation_input_tokens:
          type: integer
        cache_read_input_tokens:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
    github_com_0glabs_0g-router_pkg_inference.ToolFunction:
      type: object
      properties:
        description:
          description: Function description
          type: string
          example: Get weather
        name:
          description: Function name
          type: string
          example: get_weather
        parameters:
          description: JSON Schema for parameters
    github_com_0glabs_0g-router_pkg_inference.ImageGenerationResponse:
      type: object
      properties:
        created:
          description: Creation timestamp
          type: integer
          example: 1677652288
        data:
          description: Image data list
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ImageData'
    github_com_0glabs_0g-router_pkg_inference.ImageData:
      type: object
      properties:
        b64_json:
          description: Base64 encoded image data
          type: string
        revised_prompt:
          description: Revised prompt
          type: string
          example: A sunset..
        url:
          description: Image URL
          type: string
          example: https://...
    github_com_0glabs_0g-router_pkg_inference.AnthropicRequest:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.Attachment'
        max_tokens:
          type: integer
        messages:
          description: AnthropicMessage objects
          type: array
          items: {}
        metadata: {}
        model:
          type: string
        plugins:
          description: 0G Router extensions (stripped before forwarding)
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.Plugin'
        provider:
          $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ProviderPreferences'
        stop_sequences:
          type: array
          items:
            type: string
        stream:
          type: boolean
        system:
          description: string or []AnthropicContentBlock
        temperature:
          type: number
        tool_choice: {}
        tools:
          type: array
          items: {}
        top_k:
          type: integer
        top_p:
          type: number
    internal_handler.RoutePreviewResponse:
      type: object
      properties:
        object:
          type: string
        providers:
          type: array
          items:
            $ref: '#/components/schemas/internal_handler.RoutePreviewCandidate'
