    internal_handler.RoutePreviewRequest:
      type: object
      properties:
        model:
          description: 'OPTIONAL: canonical id (or alias / on-chain id); empty = any provider of this service type'
          type: string
        service_type:
          description: chatbot | text-to-image | image-editing | speech-to-text
          type: string
    github_com_0glabs_0g-router_pkg_inference.TraceInfo:
      type: object
      properties:
        billing:
          description: 'Billing is a pointer + omitempty so it is genuinely OMITTED (not emitted as

            {"input_cost":"","output_cost":"","total_cost":""}) when the cost couldn''t

            be computed — a mode-read/pricing error or missing billing service. The

            success path always sets it, so the normal wire shape is unchanged.'
          allOf:
          - $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.BillingInfo'
        provider:
          description: Provider address
          type: string
          example: 0x1234...
        request_id:
          description: Request ID
          type: string
          example: req_abc123
        tee_verified:
          description: 'TEE verification: nil=not requested, true=verified, false=failed'
          type: boolean
    github_com_0glabs_0g-router_pkg_inference.AnthropicResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.AnthropicContentBlock'
        id:
          type: string
        model:
          type: string
        role:
          description: '"assistant"'
          type: string
        stop_reason:
          type: string
        type:
          description: '"message"'
          type: string
        usage:
          $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.AnthropicUsage'
