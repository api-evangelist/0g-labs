      operationId: postRoutingPreview
      x-operation-id-source: derived
  /videos:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Submit a video generation job (OpenAI Video API shape). The response includes `id` and `provider_address` — clients poll `GET /videos/{id}?provider_address=...` and download the result from `GET /videos/{id}/content?provider_address=...`.

        Accepts `application/json` OR `multipart/form-data`. Use multipart to drive image-to-video: send the same fields as form values plus the reference image as a file part.

        Supports provider routing preferences via `X-0G-Provider-*` request headers (`Address`, `Sort`, `Trust-Mode`, `Allow-Fallbacks`), identical to the other inference endpoints.

        The request shape is the OpenAI Video API''s, but the models behind it are not OpenAI''s, and where a model''s own limits differ from OpenAI''s they win. Those limits are per-model — read them from the model''s `description` and `pricing.variants` on `GET /v1/models` rather than assuming the OpenAI defaults — and a request that violates one is rejected by the model provider, so the error text and any numeric code in it are theirs, not ours. The two that differ most often are `size` and `seconds`.

        `size` names a resolution TIER, not output dimensions, because a video model advertises the tiers it is PRICED at rather than arbitrary sizes. Two spellings are accepted and they are not equivalent. **Pixel dimensions** (`1280x720`, OpenAI''s spelling and what an SDK sends) select the ASPECT RATIO only, and only for text-to-video — the clip renders at whatever tier the model serves, so on a 2K-only model `1280x720` returns a 2560x1440 clip billed at the 2K rate, not a 720p one. For **image-to-video** the aspect ratio follows your reference image, so pixel dimensions have no effect there — a tier name still selects the tier. **A tier name** (`2K`) addresses the tier directly. Send only names that appear in that list — it is the set this endpoint can price, and it grows as a model adds tiers, so read it rather than hard-coding what a model serves today. Read the tiers from `pricing.variants[].dimensions.resolution`. Omitting `size` is the recommended default — the model''s own default tier and aspect ratio apply.

        `seconds` is clamped to the model''s supported range rather than rejected, in BOTH directions and without an error: ask for less than the minimum and you get (and pay for) the minimum; ask for more than the maximum and you get the maximum. The clip you are billed for is the one actually produced, so a request outside the range costs something other than what you asked for. The range is per-model and stated in the model''s description.

        For both fields the submit response echoes what you SENT, while the poll response reports what was actually rendered. Reconcile against the poll.'
      tags:
      - Inference
      summary: Submit async video generation job
      parameters:
      - description: 'Routing: pin to a specific provider by on-chain address (0x-prefixed).'
        name: X-0G-Provider-Address
        in: header
        schema:
          type: string
      - description: 'Routing: provider sort strategy. `latency` | `price`.'
        name: X-0G-Provider-Sort
        in: header
        schema:
          type: string
      - description: 'Routing: trust tier filter (`verified` | `private`). `verified` is a floor — `private` providers also satisfy it.'
        name: X-0G-Provider-Trust-Mode
        in: header
        schema:
          type: string
      - description: 'Routing: whether to retry on other providers after a failure. `true` | `false`. Defaults to false when an address is pinned, true otherwise.'
        name: X-0G-Provider-Allow-Fallbacks
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: Video generation request. `model`, `prompt` and `seconds` are REQUIRED (`seconds` is optional in the upstream OpenAI Video API but mandatory here — see the changelog); `size` is optional.
        required: true
      responses:
        '200':
          description: Job submitted; response carries id, status, provider_address
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Request error — includes `seconds is required` and a `seconds` value the model has no price for (the available durations are listed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: model_not_found — no provider on the network serves this model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '423':
          description: refund_pending — a refund is in progress for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '429':
          description: video_jobs_in_flight_limit — too many unfinished video jobs for this account; poll or wait for the earlier ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '501':
          description: Not available in USD mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '503':
          description: no_available_provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
      operationId: postVideos
      x-operation-id-source: derived
  /videos/{id}:
    get:
      security:
      - ApiKeyAuth: []
      description: Return a video job's current status. When the job has completed this is also what settles the charge. `provider_address` is optional — it is resolved from the job id when omitted, so an OpenAI-native client can call `GET /videos/{id}` with no query parameters.
      tags:
      - Inference
      summary: Poll async video generation job
      parameters:
      - description: Video job id returned by POST /videos
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Pin the provider that owns this job; resolved from the job id when omitted
        name: provider_address
        in: query
        schema:
          type: string
      - description: Verify the provider's TEE signature and include the trace
        name: verify_tee
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Job status; on completion the result payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Request error — includes a job id tracked against more than one provider, where `provider_address` must be supplied to disambiguate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '403':
          description: Caller is not the submitter of this job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: async_job_not_found — this router has no such job id (it never existed, or it belongs to a different provider than the one pinned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '502':
          description: Upstream provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
      operationId: getVideosById
      x-operation-id-source: derived
  /videos/{id}/content:
    get:
      security:
      - ApiKeyAuth: []
      description: Stream the finished video file. If the job has not been charged yet (the client never polled `GET /videos/{id}`) it is charged before any bytes are sent. A job that is still running returns 409; a job that failed at the provider returns 424. `provider_address` is optional — it is resolved from the job id when omitted.
      tags:
      - Inference
      summary: Download a completed video
      parameters:
      - description: Video job id returned by POST /videos
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Pin the provider that owns this job; resolved from the job id when omitted
        name: provider_address
        in: query
        schema:
          type: string
      - description: Verify the provider's TEE signature before billing
        name: verify_tee
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: The video file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Request error — includes a job id tracked against more than one provider, where `provider_address` must be supplied to disambiguate
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '403':
          description: Caller is not the submitter of this job
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '404':
          description: async_job_not_found — this router has no such job id (it never existed, or it belongs to a different provider than the one pinned)
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '409':
          description: Video not ready yet; keep polling GET /videos/{id}
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '424':
          description: The video job failed at the provider and has no output
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '429':
          description: Too many concurrent downloads for this account
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '502':
          description: Upstream provider error
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
      operationId: getVideosByIdContent
      x-operation-id-source: derived
