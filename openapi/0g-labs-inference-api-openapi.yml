          type: string
    github_com_0glabs_0g-router_pkg_inference.Attachment:
      type: object
      properties:
        file_id:
          description: File ID from upload endpoint
          type: string
          example: file-abc123
    github_com_0glabs_0g-router_pkg_inference.Usage:
      type: object
      properties:
        completion_tokens:
          description: Output tokens
          type: integer
          example: 20
        prompt_tokens:
          description: Input tokens
          type: integer
          example: 10
        prompt_tokens_details:
          $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_inference.PromptTokensDetails'
        total_tokens:
          description: Total tokens
          type: integer
          example: 30
    github_com_0glabs_0g-router_pkg_inference.ChatMessage:
      type: object
      properties:
        content:
          description: Message content
          type: string
          example: Hello!
        role:
          description: 'Role: system, user, assistant'
          type: string
