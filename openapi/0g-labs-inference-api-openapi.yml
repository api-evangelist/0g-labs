openapi: 3.2.0
info:
  description: 0G Router is an API gateway between users and the decentralized 0G Compute Provider network.
  title: 0G Router Inference API
  termsOfService: https://0g.ai/terms
  contact:
    name: 0G Labs
    url: https://0g.ai
    email: contact@0g.ai
  version: '1.0'
servers:
- url: /v1
tags:
- name: Inference
paths:
  /async/images/edits:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Submit an image editing job to be processed asynchronously. The response includes `jobId` and `provider_address` — clients then poll `/v1/async/jobs/{jobId}` with `?provider_address=...` to retrieve the result.

        Supports provider routing preferences via `X-0G-Provider-*` request headers (`Address`, `Sort`, `Trust-Mode`, `Allow-Fallbacks`). Multipart endpoints have no body-side routing surface — headers only.'
      tags:
      - Inference
      summary: Submit async image edit job
      parameters:
      - description: 'Routing: pin to a specific provider by on-chain address (0x-prefixed).'
        name: X-0G-Provider-Address
        in: header
        schema:
          type: string
      - description: 'Routing: provider sort strategy. `latency` | `price`.'
        name: X-0G-Provider-Sort
        in: header
        schema:
          type: string
      - description: 'Routing: trust tier filter (`verified` | `private`). `verified` is a floor — `private` providers also satisfy it.'
        name: X-0G-Provider-Trust-Mode
        in: header
        schema:
          type: string
      - description: 'Routing: whether to retry on other providers after a failure. `true` | `false`. Defaults to false when an address is pinned, true otherwise.'
        name: X-0G-Provider-Allow-Fallbacks
        in: header
        schema:
          type: string
      responses:
        '202':
          description: Job submitted; response carries jobId, status, provider_address
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '423':
          description: Refund pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
        '503':
          description: No available provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorResponse'
      operationId: postAsyncImagesEdits
      x-operation-id-source: derived
