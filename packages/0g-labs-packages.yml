notes: >-
  0G ships first-party client libraries for Storage (TypeScript + Go) and Compute (TypeScript).
  There is no first-party Python or Rust client library on a public registry as of this probe;
  the Rust code in the 0gfoundation org is node software (0g-storage-node, 0g-da-node,
  0g-reth), not a client SDK. The Router API itself needs no 0G SDK at all — it is
  OpenAI-/Anthropic-wire-compatible, so `openai`, `anthropic`, LangChain, LlamaIndex and the
  Vercel AI SDK work by changing base_url and api_key.
