sla:
  url: null
  uptime_target: null
  detail: >-
    No published SLA or uptime target. The Router's availability posture is stated behaviourally
    instead: round-robin across healthy providers with automatic failover, 502 when failover is
    exhausted, 503 when no provider for the model is healthy, and an explicit refusal to fall
    back to a different model on the caller's behalf.
