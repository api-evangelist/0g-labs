deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  detail: >-
    0G publishes no standalone deprecation policy page and does not advertise RFC 8594
    Sunset/Deprecation headers. It DOES practise in-band deprecation notice: the OpenAPI carries
    a Changelog section in info.description whose entries call out breaking behaviour changes
    explicitly, and the routing docs mark a superseded surface as deprecated with a stated
    replacement and a "will be phased out in a future release" warning.
  observed_deprecations:
  - item: 'JSON body `provider: {…}` routing object'
    replaced_by: X-0G-Provider-* request headers
    status: deprecated, kept for back-compat
    reason: >-
      Headers are the only routing surface that works uniformly across JSON, multipart and async
      endpoints. Multipart endpoints have no body routing surface at all.
    source: https://docs.0g.ai/developer-hub/building-on-0g/compute-network/router/routing
  - item: sk- API key access to /v1/account/*
    status: removed (breaking change, announced in the authentication docs)
    replaced_by: mk- management key with the account:read scope
    source: https://docs.0g.ai/developer-hub/building-on-0g/compute-network/router/authentication
  - item: '"A0GI" token ticker'
    status: deprecated
    detail: A0GI was a testnet-only gas token on the retired Newton testnet (chain ID 16600). The mainnet ticker is 0G.
    source: https://0g.ai/llms.txt
  - item: '@0glabs/0g-ts-sdk npm package'
    status: superseded
    replaced_by: '@0gfoundation/0g-storage-ts-sdk'
  breaking_change_notice_channel: >-
    OpenAPI info.description "Changelog" section, with an ### Unreleased block for merged-but-not-live
    changes that is cut into a dated ### vX.Y — YYYY-MM section on release.
