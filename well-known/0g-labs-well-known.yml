findings:
- id: llms-txt-links-404
  severity: low
  detail: >-
    Every "Table of Contents" link in https://docs.0g.ai/llms.txt carries a /docs/ path prefix
    (e.g. https://docs.0g.ai/docs/developer-hub/.../router/authentication) that returns 404. The
    same page without the /docs/ segment returns 200. The llms.txt index is therefore
    unresolvable as published — an agent following it hits 404 on every entry.
  evidence:
  - url: https://docs.0g.ai/docs/developer-hub/building-on-0g/compute-network/router/authentication
    status: 404
  - url: https://docs.0g.ai/developer-hub/building-on-0g/compute-network/router/authentication
