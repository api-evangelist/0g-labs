apis:
- name: 0G Chain JSON-RPC
  description: >-
    Ethereum-compatible JSON-RPC endpoint for the 0G Chain mainnet ("Aristotle", chain ID 16661), an AI-focused
    Layer 1 with sub-second finality. Standard EVM methods (eth_chainId, eth_call, eth_sendRawTransaction,
    …) work unchanged with Hardhat, Foundry, Truffle, ethers.js and viem. Chain-specific surface is exposed
    through precompiles — DASigners at 0x…1000 for data-availability signer registration and quorum queries,
    and Wrapped0GBase at 0x…1001 for wrapping the native token as ERC-20 — plus staking and validator
    contract interfaces.
  humanURL: https://docs.0g.ai/developer-hub/mainnet/mainnet-overview
  baseURL: https://evmrpc.0g.ai
  tags:
  - Blockchain
  - EVM
  - Web3
  - json-rpc
  - crypto-infrastructure
  tags_raw:
  - blockchain
  - evm
  - web3
  - json-rpc
  - crypto-infrastructure
  properties:
  - type: Documentation
    url: https://docs.0g.ai/developer-hub/mainnet/mainnet-overview
  - type: Explorer
    url: https://chainscan.0g.ai
- name: 0G DA (Data Availability) gRPC
  description: >-
    gRPC surface for the 0G data-availability layer. The Disperser service accepts blobs asynchronously
    (DisperseBlob), exposes polling for processing state (GetBlobStatus) and retrieval of a previously
    dispersed blob (RetrieveBlob); the Retriever service reads blobs back from the DA nodes; and the node-side
    Signer service handles BatchSign, BatchRetrieve and GetStatus. Rollups settle against this layer —
    OP Stack, Arbitrum Nitro, EigenLayer AVS and Babylon AVS integrations are all documented.
  humanURL: https://docs.0g.ai/developer-hub/building-on-0g/da-integration
  x-deployment: self-hosted
  x-baseurl-note: >-
    0G hosts no public DA endpoint — a DA Client, Encoder and Retriever are run by the integrator (the
    docs default the client server to 127.0.0.1:51001, and the container publishes port 51001). No baseURL
    is recorded rather than pointing one at a docs page or a localhost address; the contract here is the
    protobuf, not a vendor-operated endpoint.
  tags:
  - data-availability
  - Blockchain
  - Web3
  - grpc
  - crypto-infrastructure
  tags_raw:
  - data-availability
  - blockchain
  - web3
  - grpc
  - crypto-infrastructure
  properties:
  - type: Protobuf
    url: grpc/0g-labs-da-disperser.proto
  - type: Protobuf
    url: grpc/0g-labs-da-retriever.proto
  - type: Protobuf
    url: grpc/0g-labs-da-signer.proto
  - type: Documentation
    url: https://docs.0g.ai/developer-hub/building-on-0g/da-integration
  - type: SourceCode
    url: https://github.com/0gfoundation/0g-da-client
- name: 0G Storage Indexer
  description: >-
    Indexer service for the 0G Storage network. It locates the storage nodes holding a file's segments,
    brokers uploads and downloads addressed by Merkle root hash, and handles the on-chain Flow contract
    interaction internally for SDK callers. Reached through the Go and TypeScript storage SDKs, the 0g-storage-client
    CLI, and a REST gateway mode on the CLI; the mainnet indexer is indexer-storage-turbo.0g.ai.
  humanURL: https://docs.0g.ai/developer-hub/building-on-0g/storage/sdk
  baseURL: https://indexer-storage-turbo.0g.ai
