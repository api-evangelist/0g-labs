aid: 0g-labs
name: 0G Labs
description: >-
  0G Labs builds 0G (Zero Gravity), a decentralized AI operating system (deAIOS) that packages four
  modular layers into one stack: 0G Chain, an EVM-compatible Layer 1 with sub-second finality
  (mainnet "Aristotle", chain ID 16661); 0G Storage, a decentralized storage network for large AI
  datasets addressed by Merkle root hash and reachable through an indexer service, Go/TypeScript SDKs
  and a CLI; 0G DA, a data-availability layer using erasure coding and KZG commitments that OP Stack,
  Arbitrum Nitro and AVS rollups can settle against; and the 0G Compute Network, a decentralized GPU
  marketplace where every inference provider runs inside a TEE and attests to the model it serves.
  The developer-facing API is the 0G Compute Router at router-api.0g.ai — an OpenAI- and
  Anthropic-compatible gateway in front of the whole provider network, with a published OpenAPI 3.0
  covering chat completions, the Anthropic messages shape, image generation and edits (sync and
  async), audio transcription, video generation, model and provider catalogs, routing preview,
  account balance and usage, and API-key management. Authentication splits into billable `sk-` API
  keys for inference and scope-limited `mk-` management keys for account and key administration.
