  url: https://docs.0g.ai/developer-hub/building-on-0g/compute-network/router/routing
  detail: The deprecated JSON body `provider` routing object is called out inline in the docs.
- name: GitHub releases
  url: https://github.com/0gfoundation
  detail: Node, SDK and client releases are cut per-repo on GitHub, not aggregated into one changelog.
